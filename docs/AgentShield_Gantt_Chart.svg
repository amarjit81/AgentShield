<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description">
  <title id="title">AgentShield 12-week project Gantt chart</title>
  <desc id="description">A twelve-week milestone plan covering planning, architecture, backend, policies, approval workflow, demo tools, frontend, testing, deployment, and final documentation.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #dbeafe; }
      .section { font: 700 15px Arial, sans-serif; fill: #334155; letter-spacing: 0.5px; }
      .week { font: 700 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .task { font: 600 15px Arial, sans-serif; fill: #172033; }
      .owner { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .bartext { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .milestone { font: 700 13px Arial, sans-serif; fill: #172033; }
      .small { font: 400 12px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="#f8fafc"/>
  <rect x="38" y="32" width="1324" height="786" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M60 32H1340Q1362 32 1362 54V164H38V54Q38 32 60 32Z" fill="url(#header)"/>
  <text class="title" x="78" y="91">AgentShield — Project Gantt Chart</text>
  <text class="subtitle" x="78" y="124">12-week implementation and evaluation plan • Team LocalHosters • TeamID-2</text>

  <rect x="78" y="188" width="1284" height="56" rx="10" fill="#f1f5f9"/>
  <text class="section" x="96" y="221">WORKSTREAM</text>
  <text class="section" x="374" y="221">OWNER</text>

  <g>
    <text class="week" x="524" y="213">W1</text><text class="week" x="592" y="213">W2</text>
    <text class="week" x="660" y="213">W3</text><text class="week" x="728" y="213">W4</text>
    <text class="week" x="796" y="213">W5</text><text class="week" x="864" y="213">W6</text>
    <text class="week" x="932" y="213">W7</text><text class="week" x="1000" y="213">W8</text>
    <text class="week" x="1068" y="213">W9</text><text class="week" x="1136" y="213">W10</text>
    <text class="week" x="1204" y="213">W11</text><text class="week" x="1272" y="213">W12</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="490" y1="188" x2="490" y2="711"/>
    <line x1="558" y1="188" x2="558" y2="711"/><line x1="626" y1="188" x2="626" y2="711"/>
    <line x1="694" y1="188" x2="694" y2="711"/><line x1="762" y1="188" x2="762" y2="711"/>
    <line x1="830" y1="188" x2="830" y2="711"/><line x1="898" y1="188" x2="898" y2="711"/>
    <line x1="966" y1="188" x2="966" y2="711"/><line x1="1034" y1="188" x2="1034" y2="711"/>
    <line x1="1102" y1="188" x2="1102" y2="711"/><line x1="1170" y1="188" x2="1170" y2="711"/>
    <line x1="1238" y1="188" x2="1238" y2="711"/><line x1="1306" y1="188" x2="1306" y2="711"/>
    <line x1="78" y1="296" x2="1362" y2="296"/><line x1="78" y1="348" x2="1362" y2="348"/>
    <line x1="78" y1="400" x2="1362" y2="400"/><line x1="78" y1="452" x2="1362" y2="452"/>
    <line x1="78" y1="504" x2="1362" y2="504"/><line x1="78" y1="556" x2="1362" y2="556"/>
    <line x1="78" y1="608" x2="1362" y2="608"/><line x1="78" y1="660" x2="1362" y2="660"/>
    <line x1="78" y1="712" x2="1362" y2="712"/>
  </g>

  <g>
    <text class="task" x="96" y="276">Requirements &amp; project planning</text><text class="owner" x="374" y="276">Entire team</text>
    <text class="task" x="96" y="328">Threat model &amp; architecture</text><text class="owner" x="374" y="328">Security / backend</text>
    <text class="task" x="96" y="380">Database, authentication &amp; agents</text><text class="owner" x="374" y="380">Backend</text>
    <text class="task" x="96" y="432">Deterministic policy engine</text><text class="owner" x="374" y="432">Policy / backend</text>
    <text class="task" x="96" y="484">Approval, execution &amp; audit flow</text><text class="owner" x="374" y="484">Backend</text>
    <text class="task" x="96" y="536">Refund, email &amp; sandbox demos</text><text class="owner" x="374" y="536">Integration</text>
    <text class="task" x="96" y="588">Dashboard &amp; API integration</text><text class="owner" x="374" y="588">Frontend</text>
    <text class="task" x="96" y="640">Testing &amp; security hardening</text><text class="owner" x="374" y="640">Entire team</text>
    <text class="task" x="96" y="692">Deployment, report &amp; evaluation</text><text class="owner" x="374" y="692">Entire team</text>
  </g>

  <g>
    <rect x="496" y="258" width="124" height="28" rx="7" fill="#2563eb"/><text class="bartext" x="558" y="277">PLAN</text>
    <rect x="564" y="310" width="124" height="28" rx="7" fill="#2563eb"/><text class="bartext" x="626" y="329">DESIGN</text>
    <rect x="632" y="362" width="192" height="28" rx="7" fill="#2563eb"/><text class="bartext" x="728" y="381">CORE PLATFORM</text>
    <rect x="700" y="414" width="260" height="28" rx="7" fill="#2563eb"/><text class="bartext" x="830" y="433">OPA POLICIES</text>
    <rect x="836" y="466" width="192" height="28" rx="7" fill="#2563eb"/><text class="bartext" x="932" y="485">SECURE FLOW</text>
    <rect x="904" y="518" width="192" height="28" rx="7" fill="#2563eb"/><text class="bartext" x="1000" y="537">3 DEMOS</text>
    <rect x="972" y="570" width="192" height="28" rx="7" fill="#2563eb"/><text class="bartext" x="1068" y="589">DASHBOARD</text>
    <rect x="1040" y="622" width="192" height="28" rx="7" fill="#2563eb"/><text class="bartext" x="1136" y="641">VERIFY</text>
    <rect x="1176" y="674" width="124" height="28" rx="7" fill="#f59e0b"/><text class="bartext" x="1238" y="693">FINALIZE</text>
  </g>

  <g>
    <text class="section" x="78" y="752">KEY MILESTONES</text>
    <circle cx="230" cy="778" r="7" fill="#2563eb"/><text class="milestone" x="246" y="783">W2 — Plan approved</text>
    <circle cx="480" cy="778" r="7" fill="#2563eb"/><text class="milestone" x="496" y="783">W6 — Core gateway ready</text>
    <circle cx="770" cy="778" r="7" fill="#2563eb"/><text class="milestone" x="786" y="783">W10 — Integrated demo</text>
    <circle cx="1035" cy="778" r="7" fill="#f59e0b"/><text class="milestone" x="1051" y="783">W12 — Deployment &amp; evaluation</text>
  </g>

  <rect x="1105" y="113" width="14" height="14" rx="3" fill="#2563eb"/><text class="subtitle" x="1128" y="125">Completed</text>
  <rect x="1230" y="113" width="14" height="14" rx="3" fill="#f59e0b"/><text class="subtitle" x="1253" y="125">Final stage</text>
</svg>
